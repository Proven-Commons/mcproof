[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcproof-stack"
version = "0.1.0"
description = "Phase 4 live 4-layer mount and Phase 6 multi-MDE composition harness for siliconcordat/mde#4"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.26",
]

[project.scripts]
mcproof-stack = "mcproof_stack.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
